name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

jobs:
  test:
    name: PHP ${{ matrix.php }} Test & Code Quality
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4"]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@27853eb8b46dc01c33bf9fef67d98df2683c3be2 # 2.34.0
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_sqlite, sqlite3, yaml
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run Code Style Check (PHP-CS-Fixer)
        run: composer cs-check

      - name: Run Static Analysis (PHPStan)
        run: composer phpstan

      - name: Run Refactoring Check (Rector)
        run: composer rector

      - name: Run Tests (PHPUnit)
        run: composer test
